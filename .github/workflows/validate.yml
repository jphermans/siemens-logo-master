name: Validate and package skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_skill.py
      - run: python scripts/render_report.py assets/example_circuit.json example.pdf
      - run: python scripts/package_skill.py
      - run: python -c "from zipfile import ZipFile; z=ZipFile('Siemens_LOGO_Master_Skill_v1.1_A0.zip'); assert 'SKILL.md' in z.namelist(); assert z.testzip() is None"
      - uses: actions/upload-artifact@v4
        with:
          name: Siemens_LOGO_Master_Skill_v1.1_A0
          path: Siemens_LOGO_Master_Skill_v1.1_A0.zip
